<!-- NATIVE ORBIX PRELOAD ANIMATION (PRECISE REFERENCE ALIGNMENT) -->
<div id="orbix-native-preloader" aria-hidden="true">
  <div class="orbix-preloader-bg">
    <canvas id="orbix-noise-canvas" class="orbix-noise"></canvas>
    
    <div class="orbix-viewport-box">
      <svg id="orbix-loader-svg" viewBox="0 0 1440 810" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <style>
            @font-face {
              font-family: 'Fustat';
              src: url('https://fonts.gstatic.com/s/fustat/v4/NaPZcZ_aHO9Iy5tLSPJC.woff2') format('woff2');
              font-weight: 700;
            }
            .orbix-guide-line {
              stroke: rgba(255, 255, 255, 0.42);
              stroke-width: 1.2px;
              fill: none;
            }
            .orbix-text-base {
              font-family: 'Fustat', -apple-system, sans-serif;
              font-size: 196px;
              font-weight: 700;
              letter-spacing: -0.05em;
              text-anchor: middle;
              dominant-baseline: alphabetic;
            }
            .orbix-text-stroke {
              fill: none;
              stroke: #a2f0c7;
              stroke-width: 2.2px;
              stroke-dasharray: 1200;
              stroke-dashoffset: 1200;
              animation: orbixStrokeDraw 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.2s forwards;
            }
            .orbix-text-fill {
              fill: #a2f0c7;
              opacity: 0;
              animation: orbixFillFade 0.45s ease 1.75s forwards;
            }
            .g-anim-h1 {
              stroke-dasharray: 800;
              stroke-dashoffset: 800;
              animation: orbixGuideDraw 1.2s ease 0.05s forwards;
            }
            .g-anim-h2 {
              stroke-dasharray: 450;
              stroke-dashoffset: 450;
              animation: orbixGuideDraw 1.1s ease 0.15s forwards;
            }
            .g-anim-h3 {
              stroke-dasharray: 600;
              stroke-dashoffset: 600;
              animation: orbixGuideDraw 1.1s ease 0.2s forwards;
            }
            .g-anim-v {
              stroke-dasharray: 400;
              stroke-dashoffset: 400;
              animation: orbixGuideDraw 1.1s ease 0.25s forwards;
            }
            .g-anim-diag {
              stroke-dasharray: 650;
              stroke-dashoffset: 650;
              animation: orbixGuideDraw 1.3s ease 0.25s forwards;
            }
            .g-anim-circle {
              stroke-dasharray: 500;
              stroke-dashoffset: 500;
              animation: orbixGuideDraw 1.2s ease 0.3s forwards;
            }
            @keyframes orbixStrokeDraw {
              to { stroke-dashoffset: 0; }
            }
            @keyframes orbixFillFade {
              to { opacity: 1; }
            }
            @keyframes orbixGuideDraw {
              to { stroke-dashoffset: 0; }
            }
          
.framer-8oses-container, [data-framer-name="Desktop Loader"], [data-framer-name="Mobile Loader"] { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
</style>
        </defs>

        <!-- Drafting Guidelines mathematically matching the reference -->
        <g class="orbix-guides" opacity="0.6">
          <!-- 1. Horizontal Baseline intersecting text at baseline Y=488 -->
          <line class="orbix-guide-line g-anim-h1" x1="390" y1="488" x2="1080" y2="488" />
          
          <!-- 2. Horizontal Midline intersecting waist Y=414 -->
          <line class="orbix-guide-line g-anim-h2" x1="580" y1="414" x2="960" y2="414" />

          <!-- 3. Horizontal x-height cap Y=334 -->
          <line class="orbix-guide-line g-anim-h3" x1="430" y1="334" x2="980" y2="334" />

          <!-- 4. Vertical Stems -->
          <line class="orbix-guide-line g-anim-v" x1="440" y1="285" x2="440" y2="520" />
          <line class="orbix-guide-line g-anim-v" x1="575" y1="250" x2="575" y2="575" />
          <line class="orbix-guide-line g-anim-v" x1="718" y1="230" x2="718" y2="540" />
          <line class="orbix-guide-line g-anim-v" x1="865" y1="260" x2="865" y2="530" />

          <!-- 5. Iconic Diagonal Vector 8 construction line -->
          <line class="orbix-guide-line g-anim-diag" x1="380" y1="510" x2="685" y2="280" />

          <!-- 6. Geometry reference circles -->
          <circle class="orbix-guide-line g-anim-circle" cx="508" cy="411" r="77" stroke-dasharray="4 4" />
          <circle class="orbix-guide-line g-anim-circle" cx="720" cy="411" r="77" stroke-dasharray="4 4" />
        </g>

        <!-- Precisely aligned Typography -->
        <g class="orbix-typography">
          <text x="720" y="488" class="orbix-text-base orbix-text-stroke">orbix</text>
          <text x="720" y="488" class="orbix-text-base orbix-text-fill">orbix</text>
        </g>
      </svg>
    </div>
  </div>
</div>

<style id="orbix-native-preloader-styles">
#orbix-native-preloader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: transparent;
}

.orbix-preloader-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-color: rgb(14, 137, 90);
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-mask: radial-gradient(circle at 50% 50%, transparent 0%, #000 0.1%);
  mask: radial-gradient(circle at 50% 50%, transparent 0%, #000 0.1%);
  animation: orbixCameraZoom 1.1s cubic-bezier(0.85, 0, 0.15, 1) 2.5s forwards;
  will-change: mask, -webkit-mask, opacity;
}

.orbix-noise {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.12;
  mix-blend-mode: color-dodge;
  image-rendering: pixelated;
}

.orbix-viewport-box {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: orbixWordmarkScale 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes orbixWordmarkScale {
  0% { transform: scale(0.97); }
  60% { transform: scale(1); }
  85% { transform: scale(1.02); }
  100% { transform: scale(1.03); }
}

@keyframes orbixCameraZoom {
  0% {
    -webkit-mask: radial-gradient(circle 0px at 50% 50%, transparent 0%, #000 0.1%);
    mask: radial-gradient(circle 0px at 50% 50%, transparent 0%, #000 0.1%);
    opacity: 1;
  }
  15% {
    -webkit-mask: radial-gradient(circle 60px at 50% 50%, transparent 59px, #000 60px);
    mask: radial-gradient(circle 60px at 50% 50%, transparent 59px, #000 60px);
  }
  45% {
    -webkit-mask: radial-gradient(circle 260px at 50% 50%, transparent 259px, #000 260px);
    mask: radial-gradient(circle 260px at 50% 50%, transparent 259px, #000 260px);
  }
  80% {
    -webkit-mask: radial-gradient(circle 1200px at 50% 50%, transparent 1199px, #000 1200px);
    mask: radial-gradient(circle 1200px at 50% 50%, transparent 1199px, #000 1200px);
    opacity: 0.8;
  }
  100% {
    -webkit-mask: radial-gradient(circle 2600px at 50% 50%, transparent 2599px, #000 2600px);
    mask: radial-gradient(circle 2600px at 50% 50%, transparent 2599px, #000 2600px);
    opacity: 0;
    visibility: hidden;
    display: none;
  }
}

.framer-8oses-container, [data-framer-name="Desktop Loader"], [data-framer-name="Mobile Loader"] { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
</style>

<script id="orbix-native-preloader-script">
(() => {
  const canvas = document.getElementById('orbix-noise-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    canvas.width = 256;
    canvas.height = 256;
    const imgData = ctx.createImageData(256, 256);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      data[i] = v;
      data[i+1] = v;
      data[i+2] = v;
      data[i+3] = 40;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  setTimeout(() => {
    const preloader = document.getElementById('orbix-native-preloader');
    if (preloader) preloader.remove();
  }, 3800);
})();
</script>
