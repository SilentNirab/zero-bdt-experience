<style id="orbix-native-preloader-styles">
#orbix-native-preloader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: transparent;
}

.orbix-preloader-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-color: rgb(14, 137, 90);
  display: flex;
  align-items: center;
  justify-content: center;
  /* CAMERA ZOOM PORTAL EXPANDING DIRECTLY THROUGH ORBIX "O" (CENTER 33.26% 50.12%) */
  -webkit-mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, #000 0.1%);
  mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, #000 0.1%);
  animation: orbixCameraZoom 1.05s cubic-bezier(0.77, 0, 0.175, 1) 2.45s forwards;
  will-change: mask, -webkit-mask, opacity;
}

.orbix-noise {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.28;
  pointer-events: none;
  mix-blend-mode: overlay;
}

.orbix-viewport-box {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  /* CAMERA SCALE-THROUGH CENTERED EXACTLY ON ORBIX "O" */
  transform-origin: 33.26% 50.12%;
  animation: orbixZoomThroughO 1.05s cubic-bezier(0.77, 0, 0.175, 1) 2.45s forwards;
  will-change: transform, opacity;
}

#orbix-loader-svg {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.12));
}

/* ZOOM PORTAL INTO ORBIX "O" */
@keyframes orbixCameraZoom {
  0% {
    -webkit-mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 0%, #000 0.1%);
    mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 0%, #000 0.1%);
    opacity: 1;
  }
  15% {
    /* Hole opens inside inner counter of ORBIX O */
    -webkit-mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 3.2%, #000 3.3%);
    mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 3.2%, #000 3.3%);
    opacity: 1;
  }
  65% {
    -webkit-mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 48%, #000 70%);
    mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 48%, #000 70%);
    opacity: 1;
  }
  92% {
    -webkit-mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 85%, #000 100%);
    mask: radial-gradient(circle at 33.26% 50.12%, transparent 0%, transparent 85%, #000 100%);
    opacity: 0.5;
  }
  100% {
    -webkit-mask: radial-gradient(circle at 33.26% 50.12%, transparent 120%, transparent 120%, transparent 120%);
    mask: radial-gradient(circle at 33.26% 50.12%, transparent 120%, transparent 120%, transparent 120%);
    opacity: 0;
  }
}

/* CONTENT FLIES TOWARDS CAMERA PIVOTING THROUGH "O" */
@keyframes orbixZoomThroughO {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(2.8);
    opacity: 0.95;
  }
  85% {
    transform: scale(9.5);
    opacity: 0.4;
  }
  100% {
    transform: scale(18);
    opacity: 0;
  }
}
</style>

<script id="orbix-native-preloader-script">
(function() {
  function initOrbixNoise() {
    const canvas = document.getElementById('orbix-noise-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const w = canvas.width = 256;
    const h = canvas.height = 256;
    const imgData = ctx.createImageData(w, h);
    const data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
      const val = Math.random() * 255 | 0;
      data[i] = val;
      data[i+1] = val;
      data[i+2] = val;
      data[i+3] = 42;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function schedulePreloaderDismiss() {
    const preloader = document.getElementById('orbix-native-preloader');
    if (!preloader) return;

    setTimeout(() => {
      preloader.style.transition = 'opacity 0.25s ease';
      preloader.style.opacity = '0';
      setTimeout(() => {
        if (preloader && preloader.parentNode) {
          preloader.parentNode.removeChild(preloader);
        }
      }, 250);
    }, 3500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initOrbixNoise();
      schedulePreloaderDismiss();
    });
  } else {
    initOrbixNoise();
    schedulePreloaderDismiss();
  }
})();
</script>
