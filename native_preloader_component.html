<style id="orbix-native-preloader-styles">
#orbix-native-preloader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: transparent;
}

.orbix-preloader-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-color: rgb(14, 137, 90);
  display: flex;
  align-items: center;
  justify-content: center;
  /* Exact camera zoom-through mask */
  -webkit-mask: radial-gradient(circle at 265px 50%, transparent 0%, #000 0.1%);
  mask: radial-gradient(circle at 265px 50%, transparent 0%, #000 0.1%);
  animation: orbixCameraZoom 1.1s cubic-bezier(0.85, 0, 0.15, 1) 2.5s forwards;
  will-change: mask, -webkit-mask, opacity;
}

.orbix-noise {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.12;
  mix-blend-mode: color-dodge;
  image-rendering: pixelated;
}

.orbix-logo-wrap {
  position: relative;
  width: min(880px, 88vw);
  height: min(320px, 32vw);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: orbixLogoScale 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.orbix-guidelines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.g-line, .g-circle {
  stroke-dasharray: 600;
  stroke-dashoffset: 600;
  animation: drawGuide 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.g-horiz-mid { animation-delay: 0.1s; }
.g-horiz-base { animation-delay: 0.2s; }
.g-vert-1 { animation-delay: 0.25s; }
.g-vert-2 { animation-delay: 0.35s; }
.g-vert-3 { animation-delay: 0.45s; }
.g-diag { animation-delay: 0.5s; }
.g-circle { animation-delay: 0.3s; }

.orbix-typography {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.orbix-stroke-text {
  font-family: 'Fustat', 'Google Sans Flex', -apple-system, sans-serif;
  font-size: 210px;
  font-weight: 700;
  letter-spacing: -0.05em;
  fill: none;
  stroke: #a2f0c7;
  stroke-width: 2.2px;
  stroke-dasharray: 900;
  stroke-dashoffset: 900;
  animation: drawLetters 1.7s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards;
}

.orbix-fill-text {
  font-family: 'Fustat', 'Google Sans Flex', -apple-system, sans-serif;
  font-size: 210px;
  font-weight: 700;
  letter-spacing: -0.05em;
  fill: #a2f0c7;
  opacity: 0;
  animation: fillLetters 0.5s ease 1.85s forwards;
}

/* Guidelines fade out gracefully before zoom */
@keyframes drawGuide {
  to { stroke-dashoffset: 0; }
}

@keyframes drawLetters {
  0% { stroke-dashoffset: 900; opacity: 0; }
  15% { opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes fillLetters {
  0% { opacity: 0; transform: scale(0.99); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes orbixLogoScale {
  0% { transform: scale(0.96); }
  60% { transform: scale(1); }
  85% { transform: scale(1.02); }
  100% { transform: scale(1.03); }
}

/* The iconic circular portal zoom that dissolves into the page */
@keyframes orbixCameraZoom {
  0% {
    -webkit-mask: radial-gradient(circle 0px at 50% 50%, transparent 0%, #000 0.1%);
    mask: radial-gradient(circle 0px at 50% 50%, transparent 0%, #000 0.1%);
    opacity: 1;
  }
  15% {
    -webkit-mask: radial-gradient(circle 60px at 50% 50%, transparent 59px, #000 60px);
    mask: radial-gradient(circle 60px at 50% 50%, transparent 59px, #000 60px);
  }
  45% {
    -webkit-mask: radial-gradient(circle 260px at 50% 50%, transparent 259px, #000 260px);
    mask: radial-gradient(circle 260px at 50% 50%, transparent 259px, #000 260px);
  }
  80% {
    -webkit-mask: radial-gradient(circle 1200px at 50% 50%, transparent 1199px, #000 1200px);
    mask: radial-gradient(circle 1200px at 50% 50%, transparent 1199px, #000 1200px);
    opacity: 0.8;
  }
  100% {
    -webkit-mask: radial-gradient(circle 2600px at 50% 50%, transparent 2599px, #000 2600px);
    mask: radial-gradient(circle 2600px at 50% 50%, transparent 2599px, #000 2600px);
    opacity: 0;
    visibility: hidden;
    display: none;
  }
}
</style>

<script id="orbix-native-preloader-script">
(() => {
  // Initialize pixel noise canvas
  const canvas = document.getElementById('orbix-noise-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    canvas.width = 256;
    canvas.height = 256;
    const imgData = ctx.createImageData(256, 256);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      data[i] = v;
      data[i+1] = v;
      data[i+2] = v;
      data[i+3] = 40;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  // Remove preloader after transition completes
  setTimeout(() => {
    const preloader = document.getElementById('orbix-native-preloader');
    if (preloader) preloader.remove();
  }, 3800);
})();
</script>
